<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111317">
<meta name="robots" content="noindex, nofollow">
<title>Монтажный план</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1000 1000'%3E%3Crect width='1000' height='1000' rx='180' fill='%23000'/%3E%3Cpath fill='%23fff' fill-rule='evenodd' d='M500 140A360 360 0 0 0 860 500A360 360 0 0 0 500 860A360 360 0 0 0 140 500A360 360 0 0 0 500 140ZM500 364L364 500L500 636L636 500Z'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;900&display=block">
<style>
:root{
  --bg:#111317; --panel:#181b21; --panel2:#1f232b; --line:#2a2f39; --line2:#363c48;
  --text:#e8eaee; --muted:#9097a3; --dim:#646b78;
  --accent:#4f8cff; --alert:#ff2a3c; --truck:#f0b03a; --warn:#ff8a4c; --now:#ff4d5e;
  --on-text:#111; --hover:#171a20; --rowline:#1c2027; --sel:#1b2a45; --grid-day:#2c323d; --grid-hr:#1d2128;
  --alert-bg:#2a1215; --alert-line:#6b1f28; --alert-text:#ff6b78;
  --gate-fg:#ffd27a; --gate-bg:#2a2112; --gate-line:#4a3a1a; --note-bg:#3a3215;
  --cmt:#c8b98a; --cmtbox-bg:#26220f; --cmtbox-line:#4a4220; --cmtbox-fg:#e8dca8;
  --warn-bg:#2a1d16; --warn-line:#5a3a28; --kind-in:#3a2e14; --kind-out-bg:#1d2a3a; --kind-out:#7fb2ff; --btn-hover:#4a5262;
  --lw:340px; --rh:44px; --radius:10px;
}
:root[data-theme="light"]{
  --bg:#f4f5f7; --panel:#ffffff; --panel2:#eef0f3; --line:#e1e4ea; --line2:#cdd2da;
  --text:#1b1f27; --muted:#5b6370; --dim:#8a919c;
  --accent:#2f6fe4; --truck:#c9820a; --warn:#d0601f; --now:#e5323f;
  --on-text:#fff; --hover:#f0f3f8; --rowline:#e8ebf0; --sel:#dfe9fc; --grid-day:#c9cfd8; --grid-hr:#eceff3;
  --alert-bg:#fde8ea; --alert-line:#f3b6bc; --alert-text:#d0182b;
  --gate-fg:#8a5a00; --gate-bg:#fdf3dc; --gate-line:#f0d9a3; --note-bg:#fbefc9;
  --cmt:#7a6420; --cmtbox-bg:#fdf7e2; --cmtbox-line:#efe1a8; --cmtbox-fg:#4f4214;
  --warn-bg:#fdeee5; --warn-line:#f5c9ad; --kind-in:#fbeccd; --kind-out-bg:#e3edfd; --kind-out:#2b62c9; --btn-hover:#b9c0cb;
}
[data-theme="light"] .overlay{background:rgba(20,25,35,.35)}
[data-theme="light"] .sheet{box-shadow:0 -10px 40px rgba(0,0,0,.18)}
[data-theme="light"] .bar{box-shadow:0 1px 2px rgba(0,0,0,.18)}
[data-theme="light"] .bar.sel{outline-color:var(--text)}
[data-theme="light"] .g-glabel,[data-theme="light"] .zh{color:color-mix(in srgb,var(--zc) 75%,#000)}
[data-theme="light"] .chip.truck.on,[data-theme="light"] .chip.tr-m.on{color:#fff}
@media (max-width:700px){ :root{ --lw:150px; --rh:50px; } }
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font:14px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
body{display:flex;flex-direction:column;height:100dvh;overflow:hidden;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
select{font:inherit}

/* header */
.top{display:flex;align-items:center;gap:10px;padding:7px 14px 5px;border-bottom:1px solid var(--line);background:var(--panel)}
.brand{display:flex;flex-direction:column;min-width:0;flex:1}
.brand small{display:none}
@media (max-width:700px){ .stats{white-space:nowrap;overflow:hidden;text-overflow:ellipsis} }
.proj{appearance:none;background:transparent;border:0;color:var(--text);font-size:16px;font-weight:650;padding:0;
  max-width:100%;text-overflow:ellipsis;overflow:hidden;white-space:nowrap;cursor:pointer}
.proj option{background:var(--panel)}
.stats{color:var(--muted);font-size:12px;margin-top:1px}
.live{display:none;white-space:nowrap}
.live.on{display:inline}
.ldot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#36c28a;margin-right:5px;vertical-align:1px;box-shadow:0 0 0 2px rgba(54,194,138,.25)}
.ldot.busy{animation:lpulse 1s ease-in-out infinite}
.ldot.err{background:var(--warn);box-shadow:none}
@keyframes lpulse{50%{opacity:.3}}
.fld{display:block;margin-top:14px;font-size:13px;color:var(--muted)}
.fld input{display:block;width:100%;margin-top:6px;height:40px;padding:0 10px;border-radius:8px;background:var(--bg);border:1px solid var(--line2);color:var(--text);font:inherit;font-size:16px;outline:0}
.fld input:focus{border-color:var(--accent)}
.btnp{margin-top:16px;height:40px;padding:0 20px;border-radius:999px;background:var(--accent);color:#fff;font-weight:650}
.btnp:disabled{opacity:.5}
.cmsg{margin-top:10px;font-size:13px;color:var(--warn)}
.iconbtn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:999px;
  background:var(--panel2);border:1px solid var(--line2);font-size:13px;white-space:nowrap}
.iconbtn:hover{border-color:var(--btn-hover)}
.iconbtn.warn{color:var(--warn);border-color:var(--warn-line);background:var(--warn-bg)}
.iconbtn svg{width:16px;height:16px}
#syncBtn,#impBtn{padding:0 10px}
/* подсказка у кнопок-иконок: появляется сразу при наведении (только там, где есть курсор) */
@media (hover:hover){
  .iconbtn[data-tip]{position:relative}
  .iconbtn[data-tip]:hover::after{content:attr(data-tip);position:absolute;top:calc(100% + 8px);right:0;z-index:40;white-space:nowrap;
    padding:6px 10px;border-radius:8px;background:var(--text);color:var(--on-text);font-size:12px;font-weight:600;pointer-events:none;
    box-shadow:0 4px 14px rgba(0,0,0,.25)}
}
#syncBtn.spin svg{animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#themeBtn .ic-moon{display:none}
[data-theme="light"] #themeBtn .ic-moon{display:block}
[data-theme="light"] #themeBtn .ic-sun{display:none}
#themeBtn{padding:0 10px}
#themeBtn .lbl{display:none}
@media (max-width:700px){ .iconbtn .lbl{display:none} .iconbtn{padding:0 10px} }

/* tabs + filters */
.controls{background:var(--panel);border-bottom:1px solid var(--line);padding:0 0 6px}
.tabs{display:flex;gap:4px;padding:7px 14px 4px}
.tab{flex:0 0 auto;padding:5px 12px;border-radius:8px;color:var(--muted);font-weight:600;font-size:14px}
.tab.on{background:var(--panel2);color:var(--text);box-shadow:inset 0 0 0 1px var(--line2)}
.search{margin-left:auto;display:flex;align-items:center;gap:6px;height:30px;padding:0 6px 0 10px;border-radius:8px;
  background:var(--bg);border:1px solid var(--line2);color:var(--dim);flex:0 1 260px;min-width:110px}
.search:focus-within{border-color:var(--accent);color:var(--text)}
.search svg{width:15px;height:15px;flex:0 0 auto}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--text);font:inherit;font-size:14px;-webkit-appearance:none}
.search input::-webkit-search-cancel-button{display:none}
.search #qx{width:20px;height:20px;border-radius:50%;background:var(--panel2);color:var(--muted);font-size:14px;line-height:1;display:none}
.search.has #qx{display:block}
mark{background:rgba(255,210,80,.35);color:inherit;border-radius:2px;padding:0 1px}
.tab .cnt{color:var(--dim);font-weight:500;margin-left:4px}
.frow{display:flex;align-items:center;gap:6px;overflow-x:auto;padding:3px 14px;scrollbar-width:none}
.frow2{display:flex;align-items:center;gap:10px;justify-content:space-between}
.frow2 .frow{min-width:0;flex:0 1 auto}
.frow2 .frow:first-child{padding-right:0}
.frow2 .frow:last-child{padding-left:0}
@media (min-width:701px){   /* десктоп: дни и локации разделены промежутком и тонкой чертой */
  .frow2{gap:0}
  .fsep{flex:0 0 1px;align-self:stretch;margin:7px 0;background:var(--btn-hover)}   /* черта отдельным элементом: маска прокрутки её не съедает */
  /* у черты — прозрачная полоса 12px: при прокрутке кнопки растворяются, не доходя до неё */
  .frow2 .frow:first-child{padding-right:26px;-webkit-mask-image:linear-gradient(to left,transparent 0,transparent 14px,#000 34px);mask-image:linear-gradient(to left,transparent 0,transparent 14px,#000 34px)}
  .frow2 .frow:last-child{padding-left:26px;-webkit-mask-image:linear-gradient(to right,transparent 0,transparent 14px,#000 34px);mask-image:linear-gradient(to right,transparent 0,transparent 14px,#000 34px)}
}
#grpBtn .ic-m{display:none}
.chip.tr-m{display:none}
@media (max-width:700px){
  .frow2{display:block}
  .frow2 .frow:first-child{padding-right:14px}
  .frow2 .frow:last-child{padding-left:14px}
  #grpBtn .lbl,#grpBtn .ic-d{display:none}
  #grpBtn .ic-m{display:block}
  #grpBtn{padding:0 10px}
  .chip.tr-m{display:inline-flex;padding:0 10px}
  .g-head .g-corner{justify-content:flex-start;padding:8px 12px 8px 10px;gap:6px;letter-spacing:0}
  .g-head .zoom button{width:24px;height:24px}
  .g-head .zoom{order:-1}
  .chip.tr-d{display:none}
}
.frow::-webkit-scrollbar{display:none}
.frow .fl{flex:0 0 auto;color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.06em;width:74px}
.fbtn{display:none}
/* строка фильтров-выпадашек (десктоп) */
.fbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:3px 14px}
.fdd{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 9px 0 12px;border-radius:8px;border:1px solid var(--line2);background:var(--bg);font-size:13px;color:var(--text)}
.fdd:hover{border-color:var(--btn-hover)}
.fdd .fl2{color:var(--dim)}
.fdd b{font-weight:600;max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fdd .dot{width:8px;height:8px;border-radius:50%;margin-right:-2px}
.fdd svg{width:14px;height:14px;color:var(--dim);transition:transform .15s}
.fdd.on{background:color-mix(in srgb,var(--accent) 14%,var(--bg));border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
.fdd.open{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.fdd.open svg{transform:rotate(180deg);color:var(--accent)}
.freset{margin-left:auto;font-size:12.5px;color:var(--muted);padding:4px 6px}
.freset:hover{color:var(--text);text-decoration:underline}
.fpanel{flex-wrap:wrap;overflow:visible;padding:6px 14px 2px}
.fpanel:empty{display:none}
@media (min-width:701px){ .frow2,#fContr{display:none} }
@media (max-width:700px){ .fbar,.fpanel{display:none!important} }
@media (max-width:700px){ .fsep{display:none} }
@media (max-width:700px){
  .tab[data-v="trucks"]{display:none}
  .tab{padding:5px 8px;font-size:13.5px} .tabs{gap:2px} .search{min-width:64px;flex:1 1 90px;padding:0 4px 0 8px}
  .fbtn{display:inline-flex;position:relative;flex:0 0 auto;align-items:center;justify-content:center;width:34px;height:30px;border-radius:8px;
    background:var(--bg);border:1px solid var(--line2);color:var(--muted)}
  .fbtn svg{width:17px;height:17px}
  .fbtn .fdot{display:none;position:absolute;top:4px;right:4px;width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px var(--panel)}
  .fbtn.active .fdot{display:block}
  .controls.fopen .fbtn{background:var(--text);color:var(--on-text);border-color:var(--text)}
  .controls:not(.fopen) .frow2,.controls:not(.fopen) #fContr{display:none}
  .controls:not(.fopen){padding-bottom:4px}
  body{display:block;position:relative}
  .top{position:absolute;left:0;right:0;top:env(safe-area-inset-top);z-index:30;transform:translate3d(0,calc(-1 * var(--off,0px)),0)}
  .controls{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top) + var(--hdrH,0px));z-index:29;transform:translate3d(0,calc(-1 * var(--off,0px)),0)}
  body > main{position:absolute;left:0;right:0;bottom:0;top:env(safe-area-inset-top);flex:none}
  .view{padding-top:var(--ovlMax,0px)}
}
.chip{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px;border-radius:999px;
  background:transparent;border:1px solid var(--line2);color:var(--muted);font-size:13px;white-space:nowrap}
.chip:hover{color:var(--text)}
.chip.on{background:var(--text);color:var(--on-text);border-color:var(--text);font-weight:600}
.chip .dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
.chip.truck.on{background:var(--truck);border-color:var(--truck)}
.chip small{opacity:.6;font-weight:500}

/* views */
main{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;overflow:auto;display:none;-webkit-overflow-scrolling:touch}
.view.on{display:block}

/* gantt */
.g-inner{position:relative;min-width:100%}
.g-head{position:sticky;top:var(--ovl,0px);z-index:5;display:flex;background:var(--panel);border-bottom:1px solid var(--line)}
.g-corner{position:sticky;left:0;z-index:6;position:sticky;width:var(--lw);flex:0 0 var(--lw);background:var(--panel);
  border-right:1px solid var(--line);padding:8px 12px;color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.06em;
  display:flex;align-items:center;gap:8px;justify-content:space-between}
.zoom{display:flex;gap:4px;flex:0 0 auto}
.g-corner > span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.g-resize{position:absolute;top:0;right:-6px;width:12px;height:100%;cursor:col-resize;touch-action:none;z-index:7;display:flex;justify-content:center}
.g-resize::after{content:"";width:3px;height:100%;background:transparent;transition:background .15s}
.g-resize:hover::after,.g-resize.drag::after{background:var(--accent)}
.g-resize i{position:absolute;top:50%;transform:translateY(-50%);width:6px;height:22px;border-radius:3px;background:var(--line2);pointer-events:none}
body.resizing{cursor:col-resize;user-select:none;-webkit-user-select:none}
.zoom button{width:26px;height:26px;border-radius:6px;background:var(--panel2);border:1px solid var(--line2);font-size:15px;line-height:1;color:var(--text)}
.g-axis{position:relative;height:46px;flex:0 0 auto}
.g-day{position:absolute;top:0;height:22px;border-left:1px solid var(--line2);padding:4px 8px;font-size:12px;font-weight:650;white-space:nowrap;clip-path:inset(0)}   /* подпись дня не залезает на соседний день (clip-path не ломает sticky, в отличие от overflow) */
.g-day span{position:sticky;left:calc(var(--lw) + 8px);display:inline-block;background:var(--panel);padding-right:6px}
.g-hr{position:absolute;bottom:4px;font-size:10px;color:var(--dim);transform:translateX(-50%);white-space:nowrap}
.g-hr.mid{color:var(--muted);font-weight:600}
.g-group{position:sticky;top:calc(var(--ovl,0px) + 47px);z-index:4;display:flex;height:40px;background:color-mix(in srgb,var(--zc) 13%,var(--bg));border-top:1px solid color-mix(in srgb,var(--zc) 45%,transparent);
  border-bottom:1px solid color-mix(in srgb,var(--zc) 30%,transparent)}
.g-glabel{position:sticky;left:0;z-index:3;display:flex;align-items:center;gap:10px;padding:0 14px;
  font-size:16px;font-weight:750;color:var(--zc);white-space:nowrap}
.g-glabel .zdot{width:10px;height:10px;border-radius:3px;background:var(--zc);box-shadow:0 0 0 3px color-mix(in srgb,var(--zc) 25%,transparent)}
.g-row{display:flex;min-height:var(--rh);border-bottom:1px solid var(--rowline)}
.g-row:hover .g-label,.g-row:hover .g-track{background-color:var(--hover)}
.g-label{cursor:default;position:sticky;left:0;z-index:3;width:var(--lw);flex:0 0 var(--lw);background:var(--bg);border-right:1px solid var(--line);
  padding:6px 10px 6px 12px;display:flex;flex-direction:column;justify-content:center;min-width:0}
.g-label .t{font-size:13px;line-height:1.25;white-space:normal;overflow-wrap:anywhere}
@media (max-width:700px){ .g-label .t{font-size:12.5px} .g-label .m{font-size:10.5px;white-space:normal} }
.g-label .m{font-size:11px;color:var(--dim);margin-top:1px;line-height:1.3}
.g-label .m:first-of-type{margin-top:3px}
.g-label .mt{color:var(--muted);font-variant-numeric:tabular-nums;font-weight:600}
.g-label .mt sup{font-size:9px;color:var(--accent);margin-left:2px}
.g-label .mz{opacity:.8}
.tlink{cursor:pointer;text-underline-offset:3px;text-decoration-thickness:1px}
.tlink:hover{text-decoration:underline}
.bar{cursor:pointer}
.lnote{display:inline-flex;align-items:center;justify-content:center;vertical-align:-2px;margin-left:6px;width:18px;height:16px;border-radius:4px;
  background:var(--note-bg);color:var(--gate-fg)}
.lnote svg{width:11px;height:11px}
.g-label.truck .t svg{color:var(--truck)}
.g-row.sel .g-label{background:var(--sel);box-shadow:inset 4px 0 0 var(--accent)}
.g-row.sel .g-track{background-color:rgba(79,140,255,.10)}
.bar.sel{outline:2px solid #fff;outline-offset:1px;z-index:2}
.card.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 0 18px rgba(79,140,255,.25)}
.tt tr.r.sel td{background:var(--sel)}
.g-row.alert .g-label{background:var(--alert-bg);box-shadow:inset 4px 0 0 var(--alert)}
.g-row.alert .g-track{background-color:rgba(255,42,60,.07)}
.g-row.alert .g-label .t{color:var(--alert-text);font-weight:700}
.g-row.alert .bar{box-shadow:0 0 0 1px #ff8a95,0 0 12px rgba(255,42,60,.55)}
.card.alert{background:var(--alert-bg);border-color:var(--alert-line)}
.card.alert::before{background:var(--alert)}
.card.alert .what{color:var(--alert-text);font-weight:700}
.g-track{position:relative;flex:0 0 auto;cursor:pointer}
.bar{position:absolute;top:50%;height:28px;margin-top:-14px;border-radius:6px;cursor:pointer;overflow:hidden;
  display:flex;align-items:center;gap:5px;padding:0 7px;font-size:11px;font-weight:600;color:#fff;white-space:nowrap;
  box-shadow:0 1px 2px rgba(0,0,0,.4);text-shadow:0 0 3px rgba(0,0,0,.65),0 1px 1px rgba(0,0,0,.5);min-width:4px}
.bar:hover{filter:brightness(1.18);box-shadow:0 0 0 1px rgba(255,255,255,.55),0 1px 2px rgba(0,0,0,.4)}
.bar .strip{position:absolute;left:0;right:0;bottom:0;height:4px}
.bar.truck{color:#1a1204;text-shadow:none;
  background:repeating-linear-gradient(135deg,#f0b03a 0 8px,#e6a52e 8px 16px)!important}
.bar svg{width:15px;height:15px;flex:0 0 auto;filter:drop-shadow(0 0 2px rgba(0,0,0,.6))}
.truck-out{position:absolute;top:50%;margin-top:-11px;width:22px;height:22px;display:flex;align-items:center;justify-content:center;
  color:var(--truck);cursor:pointer;border-radius:5px;background:rgba(240,176,58,.12)}
.truck-out svg{width:16px;height:16px}
.bar.cut-l{border-top-left-radius:0;border-bottom-left-radius:0;border-left:2px dashed rgba(255,255,255,.7)}
.bar.cut-r{border-top-right-radius:0;border-bottom-right-radius:0;border-right:2px dashed rgba(255,255,255,.7)}
.bar .note{opacity:.85}
/* момент (указано одно время): полоса в 1 час, цвет растворяется к «неизвестному» краю, внутри стрелка */
.bar.pt{background:none!important;box-shadow:none;padding:0;overflow:visible}
.bar.pt .pfill{position:absolute;inset:0;border-radius:6px}
.bar.pt.p-end .pfill{-webkit-mask-image:linear-gradient(to right,transparent,#000 92%);mask-image:linear-gradient(to right,transparent,#000 92%);border-top-left-radius:0;border-bottom-left-radius:0}
.bar.pt.p-start .pfill{-webkit-mask-image:linear-gradient(to left,transparent,#000 92%);mask-image:linear-gradient(to left,transparent,#000 92%);border-top-right-radius:0;border-bottom-right-radius:0}
.bar.pt .parr{position:absolute;top:50%;height:12px;margin-top:-6px;color:#fff;filter:drop-shadow(0 0 2px rgba(0,0,0,.7));overflow:visible}
.g-row.alert .bar.pt{box-shadow:none}
.bar.pt .pa{position:absolute;inset:0}

.nowline{position:absolute;top:0;bottom:0;width:2px;background:var(--now);z-index:4;pointer-events:none}

/* list */
.list{max-width:860px;margin:0 auto;padding:6px 14px 40px}

.zh{position:sticky;top:var(--ovl,0px);z-index:3;display:flex;align-items:center;gap:10px;margin:14px 0 0;padding:10px 12px;border-radius:8px;

.dayh span{color:var(--dim);font-size:13px}
.card{display:grid;grid-template-columns:92px 1fr;gap:4px 12px;padding:10px 12px;margin:0 0 8px;border-radius:var(--radius);
  background:var(--panel);border:1px solid var(--line);cursor:pointer;position:relative;overflow:hidden}
.card:hover{border-color:var(--line2)}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--c,#555)}
.card .time{font-variant-numeric:tabular-nums;font-weight:700;font-size:15px;line-height:1.25;padding-left:2px}

@keyframes spLogo{0%{opacity:0;transform:scale(.4) rotate(-90deg);filter:blur(4px)}70%{opacity:1;filter:none}100%{opacity:1;transform:none}}
.sp-in{text-align:center}

  animation:spName .9s cubic-bezier(.2,.7,.2,1) .25s forwards}
@keyframes spUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes spName{from{opacity:0;letter-spacing:.3em;filter:blur(6px)}to{opacity:1;letter-spacing:.02em;filter:none}}
@keyframes spOut{to{opacity:0;visibility:hidden}}
@media (prefers-reduced-motion:reduce){ .splash{animation-delay:.8s} .sp-logo,.sp-by,.sp-name{animation-duration:.01s} }
</style>

<script>
/* ===== Данные проекта из Excel (сырые ячейки листов) ===== */
const BUILTIN_SHEETS = __RAW__;   // веб-версия собирается без вшитой таблицы (null) — данные только из Google
const BUILTIN = BUILTIN_SHEETS ? {id:"builtin", name:"__NAME__", sheets:BUILTIN_SHEETS} : null;
</script>
<script>
(() => {
"use strict";
const DAY = 86400000, HOUR = 3600000, MIN = 60000;
const MONTHS = {января:0,февраля:1,марта:2,апреля:3,мая:4,июня:5,июля:6,августа:7,сентября:8,октября:9,ноября:10,декабря:11};
const MONTHS_G = ["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
const WD = ["вс","пн","вт","ср","чт","пт","сб"];
const PALETTE = ["#4f8cff","#36c28a","#e2614b","#a77bf3","#2fb8c9","#e8679f","#8fbf3f","#6b7cff","#4cc3a0","#ef7f6b","#5fa8d3","#c47ad6","#7f9cf5","#58b368","#d36c8b","#69a3a8"];
const TRUCK_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 6h11v10H2zM13 10h4l4 4v2h-8z"/><circle cx="6" cy="17.5" r="1.8" fill="currentColor"/><circle cx="17" cy="17.5" r="1.8" fill="currentColor"/></svg>';
const NOTE_SVG = '<svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 5h16v11H9l-5 4z"/></svg>';

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};

/* ===== Онлайн-таблица: настройки по умолчанию (подробности — в разделе «Онлайн-таблица на Google Диске») ===== */
const LIVE_API = "https://script.google.com/macros/s/AKfycbyVt--frIaYp_q65NQnTP02aULm6RgUnekNfpnPM4-W5N8LD5tAinhcmrNV0DUlHhnb/exec";   // адрес моста (…/exec); ссылка ?api=… или ввод при подключении его переопределяют
const LIVE_SHEET = "11SofZ2n57scQpGyay51Vsle1KVxrkB3M";   // онлайн-таблица по умолчанию (ЛУКОЙЛ 35): при первом открытии подключается сама; пусто — не подключать

/* ===== Время: храним «настенное» время как UTC, чтобы не зависеть от часового пояса ===== */
const serialToMs = n => Math.round((n - 25569) * 86400) * 1000;
const dayOf = ms => Math.floor(ms / DAY) * DAY;
const pad = n => String(n).padStart(2, "0");
const hm = ms => { const d = new Date(ms); return pad(d.getUTCHours()) + ":" + pad(d.getUTCMinutes()); };
const dm = ms => { const d = new Date(ms); return pad(d.getUTCDate()) + "." + pad(d.getUTCMonth() + 1); };
const dayTitle = ms => { const d = new Date(ms); return d.getUTCDate() + " " + MONTHS_G[d.getUTCMonth()]; };
const wd = ms => WD[new Date(ms).getUTCDay()];
const nowWall = () => { const n = new Date(); return Date.UTC(n.getFullYear(), n.getMonth(), n.getDate(), n.getHours(), n.getMinutes()); };
const span = (it, sep = "–") => it.point === "end" ? "до " + hm(it.start) : it.point === "start" ? hm(it.start) : hm(it.start) + sep + hm(it.end);   // время работы для показа
const durTxt = ms => { const m = Math.round(ms / MIN), h = Math.floor(m / 60), r = m % 60; return (h ? h + " ч" : "") + (r ? (h ? " " : "") + r + " мин" : "") || "0 мин"; };

function parseTime(v){
  if (typeof v === "number") return Math.round((v - Math.floor(v)) * 1440);
  if (typeof v === "string"){ const m = v.match(/(\d{1,2})[:.](\d{2})/); if (m) return +m[1] * 60 + +m[2]; }
  return null;
}
function parseDate(v, year){
  if (typeof v === "number" && v >= 1) return dayOf(serialToMs(v));
  if (typeof v === "string"){
    const s = v.trim().toLowerCase();
    let m = s.match(/^(\d{1,2})\s+([а-яё]+)(?:\s+(\d{4}))?/);
    if (m && MONTHS[m[2]] != null) return Date.UTC(m[3] ? +m[3] : year, MONTHS[m[2]], +m[1]);
    m = s.match(/^(\d{1,2})\.(\d{1,2})(?:\.(\d{2,4}))?$/);
    if (m){ let y = m[3] ? +m[3] : year; if (y < 100) y += 2000; return Date.UTC(y, +m[2] - 1, +m[1]); }
  }
  return null;
}
const isAll = v => /^все(\s|$)/i.test(String(v).trim());
const splitMulti = v => v == null ? [] : String(v).split(/\s*\/\s*|\s*[;,]\s*|\n/)   // « / » — макрос Excel, «, » — выпадающий список Google с несколькими значениями
  .map(s => s.trim()).filter(Boolean);
const norm = s => String(s || "").toLowerCase().replace(/\s+/g, " ").trim();

/* ===== Импорт таблицы ===== */
const HEAD = {
  date:   /^дата$/,
  start:  /начал/,
  end:    /оконч|конец|заверш/,
  action: /действ|работ|описан|задач/,
  gate:   /ворот|подъезд|заезд|разгрузк/,   // «Зона разгрузки» (раньше «Зона заезда», «Ворота») — проверяем раньше локации
  place:  /^локац|^мест|^зон|^зал/,         // «Локация» (раньше «Зона», «Место»)
  contr:  /подряд|исполн|ответств/,
  comment:/коммент|примеч|замет/
};

function findPlanSheet(sheets){
  for (const [name, rows] of Object.entries(sheets)){
    for (let r = 0; r < Math.min(rows.length, 15); r++){
      const row = rows[r] || [], cols = {};
      row.forEach((v, i) => {
        if (typeof v !== "string") return;
        const t = norm(v);
        for (const [k, re] of Object.entries(HEAD)) if (cols[k] == null && re.test(t)) { cols[k] = i; break; }
      });
      if (cols.action != null && cols.start != null && cols.end != null) return {name, rows, hr: r, cols};
    }
  }
  return null;
}

function parseProject(proj){
  if (proj.live && !proj.sheets) return {items: [], warnings: [], lists: {zones: [], contractors: [], gates: []}, loading: true};
  const warnings = [];
  const ps = findPlanSheet(proj.sheets);
  if (!ps) return {items: [], warnings: [{row: null, text: "Не нашла лист с колонками «Действие», «Время начала», «Время окончания»."}], lists: {}};
  const {rows, hr, cols} = ps;
  const cell = (row, k) => cols[k] == null ? null : row[cols[k]];
  let year = new Date().getFullYear();
  for (let r = hr + 1; r < rows.length; r++){ const v = cell(rows[r] || [], "date"); if (typeof v === "number" && v > 1){ year = new Date(serialToMs(v)).getUTCFullYear(); break; } }

  let sepDate = null, sepRow = null;
  const items = [];
  for (let r = hr + 1; r < rows.length; r++){
    const row = rows[r] || [], xl = r + 1;
    const action = cell(row, "action");
    const hasAction = action != null && String(action).trim() !== "";
    if (!hasAction){
      for (const v of row){ if (typeof v === "string"){ const d = parseDate(v, year); if (d != null){ sepDate = d; sepRow = xl; break; } } }
      continue;
    }
    const sRaw = cell(row, "start"), eRaw = cell(row, "end");
    const st = parseTime(sRaw), et = parseTime(eRaw);
    // Разделитель дня может стоять и в колонке «Действие» (версия в Google Таблицах): «24 ноября» без времени
    if (st == null && et == null){ const d = parseDate(String(action), year); if (d != null){ sepDate = d; sepRow = xl; continue; } }
    let colDate = parseDate(cell(row, "date"), year);
    if (colDate == null && typeof sRaw === "number" && sRaw >= 1) colDate = dayOf(serialToMs(sRaw));
    let date = sepDate ?? colDate;
    if (sepDate != null && colDate != null && colDate !== sepDate){
      warnings.push({row: xl, text: `«${action}»: в колонке «Дата» стоит ${dm(colDate)}, а строка находится под разделителем ${dm(sepDate)} (строка ${sepRow}). Взяла ${dm(sepDate)} — поправь дату в таблице.`});
    }
    if (date == null){ warnings.push({row: xl, text: `«${action}»: не удалось определить дату, строка пропущена.`}); continue; }
    if (st == null && et == null){ warnings.push({row: xl, text: `«${action}»: нет ни времени начала, ни окончания, строка пропущена.`}); continue; }
    // Указано только одно время — это момент: «до 22:00» (только окончание) или «15:00» (только начало)
    const point = st == null ? "end" : et == null ? "start" : null;
    const start = date + (point === "end" ? et : st) * MIN;
    let end = point ? start + MIN : date + et * MIN;
    if (!point && end <= start) end += DAY;
    const places = splitMulti(cell(row, "place"));
    const contractors = splitMulti(cell(row, "contr"));
    const gate = cell(row, "gate") ? String(cell(row, "gate")).trim() : "";
    const comment = cell(row, "comment") ? String(cell(row, "comment")).trim() : "";
    if (!places.length) warnings.push({row: xl, text: `«${action}»: не указана локация.`});
    if (!contractors.length) warnings.push({row: xl, text: `«${action}»: не указан исполнитель.`});
    items.push({
      row: xl, rows: [xl], action: String(action).trim(), places, contractors, gate, comment, start, end, point,
      truck: !!gate, out: /^(выезд|вывоз|погрузк|отъезд)/i.test(String(action).trim())
    });
  }

  // Склейка ручных дублей: 25.11 23:00–05:00 + 26.11 00:00–05:00 → одна работа
  const drop = new Set();
  for (const a of items){
    if (dayOf(a.end - 1) === dayOf(a.start)) continue;
    for (const b of items){
      if (b === a || drop.has(b)) continue;
      if (b.start === dayOf(a.end - 1) && b.end === a.end && b.start > a.start &&
          norm(b.action) === norm(a.action) && norm(b.places.join("/")) === norm(a.places.join("/"))){
        drop.add(b); a.rows.push(b.row);
        if (!a.comment && b.comment) a.comment = b.comment;
      }
    }
  }
  const out = items.filter(i => !drop.has(i)).sort((x, y) => x.start - y.start || x.end - y.end);
  out.forEach((it, i) => it.id = i);

  // Справочники: порядок берём с листа «Списки», если он есть
  const listsSheet = Object.entries(proj.sheets).find(([n]) => /спис|справ/i.test(n));
  const columns = [];
  if (listsSheet){
    const lr = listsSheet[1]; const w = Math.max(0, ...lr.map(r => (r || []).length));
    for (let c = 0; c < w; c++) columns.push(lr.map(r => (r || [])[c]).filter(v => v != null && String(v).trim()).map(v => String(v).trim()));
  }
  if (proj.lists) columns.push(...proj.lists);   // выпадающие списки из Google-версии
  function ordered(values){
    const set = [...new Set(values)];
    let best = null, score = 0;
    for (const col of columns){ const s = col.filter(v => set.includes(v)).length; if (s > score){ score = s; best = col; } }
    const res = best ? best.filter(v => set.includes(v)) : [];
    for (const v of set) if (!res.includes(v)) res.push(v);
    return res;
  }
  // Значения, которых нет на листе «Списки» (опечатки, старые названия)
  if (columns.length){
    const bestCol = values => { const set = new Set(values); let best = null, score = 0;
      for (const col of columns){ const s = col.filter(v => set.has(v)).length; if (s > score){ score = s; best = col; } } return best; };
    const checks = [["Локация", i => i.places], ["Зона разгрузки", i => i.gate ? [i.gate] : []], ["Исполнитель", i => i.contractors]];
    for (const [label, get] of checks){
      const col = bestCol(out.flatMap(get)); if (!col) continue;
      for (const it of out) for (const v of get(it)) if (!col.includes(v))
        warnings.push({row: it.rows[0], text: `«${it.action}»: значения «${v}» нет в справочнике (колонка «${label}»: выпадающий список или лист «Списки»). Похоже на опечатку или старое название — выбери значение из списка заново.`});
    }
  }
  const lists = {
    zones: ordered(out.flatMap(i => i.places)).filter(v => !isAll(v)),
    contractors: ordered(out.flatMap(i => i.contractors)).filter(v => !isAll(v)),
    gates: ordered(out.filter(i => i.gate).map(i => i.gate))
  };
  return {items: out, warnings, lists};
}

const emptyTxt = () => P.loading ? (liveErr ? "Не удалось загрузить таблицу: " + liveErr : "Загружаю таблицу из Google…") : "Под выбранные фильтры действий нет";

/* ===== Онлайн-таблица на Google Диске =====
   Приложение не хранит таблицу у себя, а спрашивает скрипт-мост (Google Apps Script, файл gas/Code.gs),
   который работает под служебным Google-аккаунтом с доступом к таблице. Раз в POLL_MS проверяем,
   менялась ли таблица; если да — скачиваем свежую версию и перерисовываем, не сбрасывая фильтры. */
const POLL_MS = 15000;
let liveT = 0, liveGen = 0, liveBusy = false, liveErr = null;
const curProj = () => projects.find(p => p.id === state.proj);
function saveProjects(){ store.set("mp.projects", projects.filter(p => p.id !== "builtin")); }
const apiUrl = () => String(store.get("mp.api", "") || LIVE_API || "").trim();
function fileIdFrom(s){
  s = String(s || "").trim();
  const m = s.match(/\/d\/([\w-]{20,})/) || s.match(/[?&]id=([\w-]{20,})/);
  return m ? m[1] : /^[\w-]{20,}$/.test(s) ? s : "";
}
function liveProj(id){ return {id: "g" + id, name: "Google Таблица", live: {file: id}, sheets: null, modified: null}; }
/* Выпадающие списки (проверка данных) из файла .xlsx — в Google-версии это справочники локаций и исполнителей
   вместо листа «Списки». SheetJS их не читает, поэтому сами открываем zip и ищем <dataValidation type="list">. */
async function xlsxLists(buf){
  try{
    const u8 = buf instanceof Uint8Array ? buf : new Uint8Array(buf), dv = new DataView(u8.buffer, u8.byteOffset, u8.byteLength), td = new TextDecoder();
    let e = u8.length - 22; while (e >= 0 && dv.getUint32(e, true) !== 0x06054b50) e--;
    if (e < 0) return [];
    const n = dv.getUint16(e + 10, true), lists = [];
    let p = dv.getUint32(e + 16, true);
    const unesc = t => t.replace(/&quot;/g, '"').replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&apos;/g, "'").replace(/&amp;/g, "&");
    for (let i = 0; i < n; i++){
      const method = dv.getUint16(p + 10, true), csize = dv.getUint32(p + 20, true), off = dv.getUint32(p + 42, true);
      const nl = dv.getUint16(p + 28, true), name = td.decode(u8.subarray(p + 46, p + 46 + nl));
      p += 46 + nl + dv.getUint16(p + 30, true) + dv.getUint16(p + 32, true);
      if (!/^xl\/worksheets\/sheet\d+\.xml$/.test(name)) continue;
      const ds = off + 30 + dv.getUint16(off + 26, true) + dv.getUint16(off + 28, true);
      let data = u8.subarray(ds, ds + csize);
      if (method === 8) data = new Uint8Array(await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).arrayBuffer());
      else if (method !== 0) continue;
      const xml = td.decode(data);
      for (const m of xml.matchAll(/<dataValidation\b[^>]*\btype="list"[^>]*>[\s\S]*?<formula1>([^<]*)<\/formula1>/g)){
        const f = unesc(m[1]).trim();
        if (/^".*"$/.test(f)) lists.push(f.slice(1, -1).split(",").map(x => x.trim()).filter(Boolean));
      }
    }
    return lists;
  }catch(err){ return []; }
}
function sheetsFromWb(wb){
  const sheets = {};
  for (const n of wb.SheetNames) sheets[n] = XLSX.utils.sheet_to_json(wb.Sheets[n], {header: 1, raw: true, defval: null});
  return sheets;
}
async function pullLive(proj, force){
  const api = apiUrl();
  if (!api) throw new Error("не указан адрес скрипта-моста");
  liveBusy = true; renderLive();
  try{
    const since = proj.sheets && !force ? proj.modified || "" : "";
    let r;
    try { r = await fetch(`${api}${api.includes("?") ? "&" : "?"}id=${encodeURIComponent(proj.live.file)}&since=${encodeURIComponent(since)}&t=${Date.now()}`, {cache: "no-store"}); }
    catch(e){ throw new Error("нет связи со скриптом-мостом"); }
    if (!r.ok) throw new Error("скрипт-мост ответил ошибкой " + r.status);
    let j; try { j = await r.json(); } catch(e){ throw new Error("скрипт-мост ответил не тем (проверь, что у веб-приложения доступ «Все»)"); }
    if (j.error) throw new Error(j.error);
    proj.checked = Date.now();
    if (j.unchanged) return false;
    if (!j.data) throw new Error("скрипт-мост не прислал таблицу");
    await loadSheetJS();
    const bin = Uint8Array.from(atob(j.data), c => c.charCodeAt(0));
    proj.sheets = sheetsFromWb(XLSX.read(bin, {type: "array"}));
    proj.lists = await xlsxLists(bin);
    proj.modified = j.modified;
    if (j.name) proj.name = String(j.name).replace(/\.(xlsx|xlsm|xls)$/i, "");
    return true;
  } finally { liveBusy = false; }
}
function reloadKeep(){   // перерисовать после обновления, сохранив выделенную работу
  const it = sel != null && P && P.items.find(i => i.id === sel);
  const key = it ? norm(it.action) + "|" + it.start : null;
  sel = null; loadProject();
  if (key){ const n = P.items.find(i => norm(i.action) + "|" + i.start === key); sel = n ? n.id : null; applySel(false); }
}
async function liveTick(){
  clearTimeout(liveT);
  const my = ++liveGen, proj = curProj();
  if (!proj || !proj.live){ renderLive(); return; }
  if (!document.hidden && !liveBusy){
    try {
      const changed = await pullLive(proj);
      liveErr = null;
      if (changed){
        saveProjects();
        if (curProj() === proj){ const first = P.loading; reloadKeep(); if (!first) toast("Таблица обновилась"); }
      }
    } catch(e){
      liveErr = e.message || "ошибка";
      if (curProj() === proj && P.loading) renderAll();
    }
  }
  renderLive();
  if (my === liveGen) liveT = setTimeout(liveTick, POLL_MS);
}
async function forceSync(){   // кнопка «Синхронизировать»: забрать таблицу целиком прямо сейчас
  const proj = curProj(), b = $("#syncBtn");

    await pullLive(proj, true); liveErr = null; saveProjects();

  } catch(e){ liveErr = e.message || "ошибка"; toast("Не удалось: " + liveErr); }
  b.classList.remove("spin"); renderLive();
  clearTimeout(liveT); liveGen++; liveT = setTimeout(liveTick, POLL_MS);
}
function renderLive(){
  const el = $("#live"), proj = curProj();

  el.innerHTML = `<i class="ldot${liveErr ? " err" : liveBusy ? " busy" : ""}"></i>${liveErr ? "нет связи" : "онлайн"}${tt}${P && !P.loading ? " · " : ""}`;
}

/* ===== Тема ===== */
// пока пользователь сам не переключал тему — берём системную
const sysLight = () => { try { return matchMedia("(prefers-color-scheme: light)").matches; } catch(_){ return false; } };
let userTheme = store.get("mp.theme", null);       // отдельный ключ: старый выбор из mp.state больше не учитывается

  const light = curTheme() === "light";

  if (light) document.documentElement.setAttribute("data-theme", "light");
  const m = document.querySelector('meta[name="theme-color"]'); if (m) m.content = light ? "#ffffff" : "#111317";
  const l = document.getElementById("themeLbl"); if (l) l.textContent = light ? "Тёмная тема" : "Светлая тема";
  const b = document.getElementById("themeBtn"); if (b) b.title = light ? "Включить тёмную тему" : "Включить светлую тему";

/* ===== Фильтры ===== */
const matchZone = it => !state.zones.length || it.places.some(p => state.zones.includes(p)) || it.places.some(isAll);
const matchContr = it => !state.contrs.length || it.contractors.some(c => state.contrs.includes(c)) || it.contractors.some(isAll) || isAlert(it);
const overlaps = (it, d) => it.start < d + DAY && it.end > d;
const matchDay = it => state.day === "*" || overlaps(it, state.day);
let query = "";
const matchQ = it => !query || norm(it.action).includes(query);
const visible = () => P.items.filter(it => matchZone(it) && matchContr(it) && matchDay(it) && (!state.trucksOnly || it.truck) && matchQ(it));
/* Исполнители, чьи строки видны всем и выделяются красным (режимные мероприятия) */
const ALERT_RE = /^фсо$/i, ALERT_COLOR = "#ff2a3c";
const isAlert = it => it.contractors.some(c => ALERT_RE.test(c));
const orderC = it => {   // выбранные в фильтре исполнители — первыми (верхний слой полосы)
  const sel = state.contrs.filter(c => it.contractors.includes(c));
  return sel.length ? [...sel, ...it.contractors.filter(c => !sel.includes(c))] : it.contractors;
};
/* Цвета исполнителей — как в выпадающем списке Google-таблицы (насыщеннее, чтобы на полосах читался текст).
   Исполнители, у которых в Google серый цвет, получили свои разные цвета. Кого здесь нет — цвет из палитры по порядку. */
const CONTR_COLORS = {
  "купер": "#1e88e5", "mmg": "#e53935", "led group": "#43a047", "bss": "#6d4c41", "emotion production": "#f2b600",
  "a-pro": "#8e6bd8", "intercomm systems": "#64b5f6", "decor factory": "#f4743b", "гкд": "#1f45a8",

let fOpen = null;   // какой список раскрыт в строке фильтров (десктоп)

    `<button class="chip truck tr-d${state.trucksOnly ? " on" : ""}" data-tronly>${TRUCK_SVG.replace("<svg", '<svg width="14" height="14"')} Только заезды</button>`;
  const c = (v, l) => `<button class="chip${(v === "*" ? !state.contrs.length : state.contrs.includes(v)) ? " on" : ""}" data-contr="${esc(v)}">${v !== "*" ? `<span class="dot" style="background:${ccolor(v)}"></span>` : ""}${esc(l)}</button>`;
  $("#fContr").innerHTML = c("*", "Все исполнители") + P.lists.contractors.map(v => c(v, v)).join("");

  /* Десктоп: одна строка с кнопками «Дата / Локация / Исполнитель» — по нажатию ниже раскрывается список значений */
  const CHEV = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>';

  const dd = (k, label, val, on, dot) => `<button class="fdd${fOpen === k ? " open" : ""}${on ? " on" : ""}" data-fopen="${k}"><span class="fl2">${label}</span>${dot ? `<span class="dot" style="background:${dot}"></span>` : ""}<b>${esc(val)}</b>${CHEV}</button>`;

    (anyF ? `<button class="freset" data-freset>Сбросить фильтры</button>` : "");

function renderAll(){
  if (state.view === "trucks" && innerWidth <= 700) state.view = "gantt";   // на телефоне вкладки «Заезды» нет
  renderFilters();
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("on", t.dataset.v === state.view));
  document.querySelectorAll(".view").forEach(v => v.classList.toggle("on", v.id === "v-" + state.view));
  const vis = visible();
  const nTr = P.items.filter(i => i.truck).length;
  $("#stats").textContent = `${dm(P.min)}–${dm(P.max - DAY)} · ${P.items.length} ${plural(P.items.length, "действие", "действия", "действий")} · ${nTr} заездов/выездов` + (vis.length !== P.items.length ? ` · показано ${vis.length}` : "");
  $("#tcnt").textContent = vis.filter(i => i.truck).length || "";
  if (state.view === "gantt") renderGantt(vis);
  else if (state.view === "list") renderList(vis);
  else renderTrucks(vis);
  applySel(true);
}

/* ===== Выделенная работа ===== */
let sel = null;
function applySel(scroll){
  document.querySelectorAll(".sel").forEach(e => e.classList.remove("sel"));
  if (sel == null) return;
  const view = $("#v-" + state.view);
  const els = view.querySelectorAll(`[data-id="${sel}"]`);
  if (!els.length) return;
  els.forEach(e => { e.classList.add("sel"); const r = e.closest(".g-row,tr.r"); if (r) r.classList.add("sel"); });
  if (!scroll) return;
  const target = view.querySelector(`.g-label[data-id="${sel}"], .card[data-id="${sel}"], tr.r[data-id="${sel}"]`) || els[0];
  const vr = view.getBoundingClientRect(), tr = target.getBoundingClientRect();
  const ovl = mobile() ? H - off + C : 0;
  view.scrollTop += tr.top - vr.top - ovl - (view.clientHeight - ovl) / 3;
  if (state.view === "gantt"){
    const bar = view.querySelector(`.bar[data-id="${sel}"]`);
    if (bar){
      const lw = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--lw"));
      const br = bar.getBoundingClientRect();
      view.scrollLeft += br.left - (vr.left + lw) - 60;
    }
  }
}

/* ===== Таймлайн (Гант) ===== */
const ZPAL = ["#5b9dff","#c084fc","#2dd4bf","#f472b6","#facc15","#fb923c"];
const zcolor = k => { const i = P.lists.zones.indexOf(k); return i >= 0 ? ZPAL[i % ZPAL.length] : "#9aa3b2"; };
function sortZoneKeys(keys){
  const order = P.lists.zones;
  const rank = k => { const i = order.indexOf(k); return i >= 0 ? i : k === ALL_LOC ? 999 : 500; };
  return keys.sort((a, b) => rank(a) - rank(b) || a.localeCompare(b));
}
const ALL_LOC = "Все локации";
const zoneKey = it => it.places.some(isAll) || it.places.length === 0 ? ALL_LOC : it.places.length > 1 ? it.places.join(" + ") : it.places[0];

/* Полоса-момент: «до 22:00» — стрелка приходит к правому краю; «15:00» — стрелка выходит от левого края */
const ARROW_SVG = '<svg class="parr" viewBox="0 0 100 12" preserveAspectRatio="none"><path d="M0 6H96" stroke="currentColor" stroke-width="2.2" vector-effect="non-scaling-stroke"/></svg>';
function pointBar(it, bg, withTime){
  const head = it.point === "end"
    ? '<svg style="position:absolute;right:1px;top:50%;margin-top:-6px;width:12px;height:12px;color:#fff;filter:drop-shadow(0 0 2px rgba(0,0,0,.7))" viewBox="0 0 12 12"><path d="M3 1.5 9 6 3 10.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>'
    : '<svg style="position:absolute;left:1px;top:50%;margin-top:-6px;width:8px;height:12px;color:#fff;filter:drop-shadow(0 0 2px rgba(0,0,0,.7))" viewBox="0 0 8 12"><path d="M2 1.5v9" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>'
      + '<svg style="position:absolute;right:1px;top:50%;margin-top:-6px;width:12px;height:12px;color:#fff;filter:drop-shadow(0 0 2px rgba(0,0,0,.7))" viewBox="0 0 12 12"><path d="M3 1.5 9 6 3 10.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  return `<span class="pfill" style="background:${bg}"></span><span class="pa">${ARROW_SVG.replace('class="parr"', `class="parr" style="${it.point === "end" ? "left:18%;width:calc(82% - 4px)" : "left:3px;width:calc(100% - 7px)"}"`)}${head}</span>` +
    (withTime ? `<span class="ptime">${hm(it.start)}</span>` : "");   // время над стрелкой — у известного края
}
function renderGantt(vis){
  const el = $("#v-gantt");
  const keepX = el.scrollLeft, keepY = el.scrollTop, sameRange = el.dataset.range === `${state.day}`;
  const mobile = innerWidth <= 700;
  if (state.zoom == null) state.zoom = mobile ? 22 : 34;
  const pxh = state.zoom;
  const firstStart = vis.length ? Math.min(...vis.map(i => i.start)) : P.min;
  const r0 = state.day === "*" ? Math.max(P.min, Math.floor(firstStart / HOUR) * HOUR - 3 * HOUR) : state.day, r1 = state.day === "*" ? P.max : state.day + DAY;
  const W = Math.round((r1 - r0) / HOUR * pxh);
  const X = ms => (Math.max(r0, Math.min(r1, ms)) - r0) / HOUR * pxh;

  if (!vis.length){ el.innerHTML = `<div class="empty">${esc(emptyTxt())}</div>`; return; }

  // ось
  let axis = "";
  for (let d = dayOf(r0); d < r1; d += DAY)
    axis += `<div class="g-day" style="left:${X(d)}px;width:${X(d + DAY) - X(d)}px"><span>${wd(d)}, ${dayTitle(d)}</span></div>`;
  const step = pxh >= 30 ? 1 : pxh >= 16 ? 2 : pxh >= 9 ? 3 : 6;
  for (let t = r0; t <= r1; t += HOUR){
    const h = new Date(t).getUTCHours();
    if (h % step || t === r0 || t === r1) continue;
    axis += `<div class="g-hr${h === 0 || h === 12 ? " mid" : ""}" style="left:${X(t)}px">${pad(h)}</div>`;
  }

  // группы по зонам
  const order = [...P.lists.zones];
  const groups = new Map();
  const grouped = state.group || state.zones.length === 1;
  for (const it of vis){ const k = grouped ? zoneKey(it) : ""; if (!groups.has(k)) groups.set(k, []); groups.get(k).push(it); }
  const keys = sortZoneKeys([...groups.keys()]);

  const gridBg = `background-image:repeating-linear-gradient(to right,var(--grid-day) 0 1px,transparent 1px ${24 * pxh}px),repeating-linear-gradient(to right,var(--grid-hr) 0 1px,transparent 1px ${pxh}px);background-position:${-((r0 - dayOf(r0)) / HOUR * pxh)}px 0,0 0`;
  let rows = "";
  for (const k of keys){
    const list = groups.get(k);
    if (grouped) rows += `<div class="g-sec"><div class="g-group" style="width:calc(var(--lw) + ${W}px);--zc:${zcolor(k)}"><div class="g-glabel"><span class="zdot"></span>${esc(k)}</div></div>`;
    for (const it of list){
      const cutL = it.start < r0, cutR = it.end > r1;
      const left = it.point ? X(it.start - (it.point === "end" ? HOUR : 0)) : X(it.start);
      const width = it.point ? Math.max(8, X(it.start + (it.point === "start" ? HOUR : 0)) - left) : Math.max(4, X(it.end) - left);
      const oc = orderC(it);
      const main = oc.find(c => !isAll(c)) || oc[0];
      const col = ccolor(main);
      const cs = oc.length > 1 ? oc.map(ccolor) : null;
      const bg = cs ? `linear-gradient(to bottom,${cs.map((c, i) => `${c} ${(i / cs.length * 100).toFixed(2)}% ${((i + 1) / cs.length * 100).toFixed(2)}%`).join(",")})` : col;
      const strip = false ? `<span class="strip" style="background:linear-gradient(to right,${cs.map((c, i) => `${c} ${i / cs.length * 100}% ${(i + 1) / cs.length * 100}%`).join(",")})"></span>` : "";
      const timeTxt = span(it);
      const iconIn = it.truck && width >= 26;
      const label = (iconIn ? TRUCK_SVG : "") + (width > (iconIn ? 140 : 120) ? `${timeTxt}${it.comment ? ` <span class="note">${NOTE_SVG}</span>` : ""}` : width > (iconIn ? 62 : 54) ? hm(it.start) : "");
      const _old = width > 120 ? `${timeTxt}${it.comment ? ` <span class="note">${NOTE_SVG}</span>` : ""}` : width > 54 ? hm(it.start) : "";
      const over = dayOf(it.end - 1) !== dayOf(it.start);
      const meta = `<div class="m mt">${it.point ? span(it) : `${hm(it.start)} → ${hm(it.end)}${over ? '<sup>+1</sup>' : ""}`}</div><div class="m">${esc(orderC(it).join(", "))}</div>${grouped ? "" : `<div class="m mz">${esc(it.places.join(", "))}</div>`}`;
      rows += `<div class="g-row${isAlert(it) ? " alert" : ""}" style="width:calc(var(--lw) + ${W}px)">
        <div class="g-label${it.truck ? " truck" : ""}" data-id="${it.id}"><div class="t">${it.truck ? TRUCK_SVG.replace("<svg", '<svg width="13" height="13" style="vertical-align:-2px;margin-right:4px"') : ""}<span class="tlink">${hl(it.action)}</span>${it.comment ? `<span class="lnote" title="${esc(it.comment)}">${NOTE_SVG}</span>` : ""}</div>${meta}</div>
        <div class="g-track" data-pick="${it.id}" style="width:${W}px;${gridBg}">
          <div class="bar${cutL ? " cut-l" : ""}${cutR ? " cut-r" : ""}${it.point ? " pt p-" + it.point + (width >= 44 ? " has-t" : "") : ""}" data-id="${it.id}" title="${esc(it.action)} · ${timeTxt}"
               style="left:${left}px;width:${width}px;background:${bg}">${it.point ? pointBar(it, bg, width >= 44) : label + strip}</div>${it.truck && !iconIn ? `<div class="truck-out" data-id="${it.id}" style="left:${left + width + 3}px">${TRUCK_SVG}</div>` : ""}
        </div></div>`;
    }
    if (grouped) rows += `</div>`;
  }
  const now = nowWall();
  const nowLine = now > r0 && now < r1 ? `<div class="nowline" style="left:calc(var(--lw) + ${X(now)}px)"></div>` : "";
  el.innerHTML = `<div class="g-inner" style="width:calc(var(--lw) + ${W}px)">
    <div class="g-head"><div class="g-corner"><span>Действие</span><span class="zoom"><button data-zoom="-1" title="Мельче">−</button><button data-zoom="1" title="Крупнее">+</button></span><span class="g-resize" title="Потяни, чтобы изменить ширину"><i></i></span></div>
    <div class="g-axis" style="width:${W}px">${axis}</div></div>${rows}${nowLine}</div>`;
  if (sameRange){ el.scrollLeft = keepX; el.scrollTop = keepY; }
  else { el.scrollTop = 0; el.scrollLeft = now > r0 && now < r1 ? Math.max(0, X(now) - 80) : state.day === "*" ? 0 : Math.max(0, X(Math.min(...vis.map(i => i.start))) - 20); }
  el.dataset.range = `${state.day}`;
}

/* ===== Список по дням ===== */
function cardHtml(it, d){
      const cont = it.start < d;
      const s = cont ? d : it.start;
      const nextDay = dayOf(it.end - 1) > d;
      const oc = orderC(it);
      const cbar = oc.length > 1 ? `linear-gradient(to bottom,${oc.map((c, i) => `${ccolor(c)} ${(i / oc.length * 100).toFixed(2)}% ${((i + 1) / oc.length * 100).toFixed(2)}%`).join(",")})` : ccolor(oc[0]);
      return `<div class="card${it.truck ? " truck" : ""}${isAlert(it) ? " alert" : ""}" data-id="${it.id}" style="--c:${cbar}">
        <div class="time">${it.point ? span(it) : `${hm(s)} – ${hm(it.end)}`}${nextDay ? `<small>до ${dm(it.end)}</small>` : ""}${cont ? `<small>с ${dm(it.start)} ${hm(it.start)}</small>` : ""}</div>
        <div class="what">${it.truck ? TRUCK_SVG.replace("<svg", '<svg width="15" height="15" style="vertical-align:-2px;margin-right:5px"') : ""}${hl(it.action)}</div>
        ${cont ? `<div class="cont">↳ продолжение действия с ${dm(it.start)}</div>` : ""}
        <div class="tags">${tagsHtml(it, state.zones.length !== 1 && !state.groupL)}</div>
        ${it.comment ? `<div class="cmt">${NOTE_SVG}<span>${esc(it.comment)}</span></div>` : ""}
      </div>`;
}
function renderList(vis){
  const el = $("#v-list");
  const days = state.day === "*" ? P.days : [state.day];
  const dayHead = (d, n, sub) => `<div class="dayh${sub ? " sub" : ""}"><b>${wd(d)}, ${dayTitle(d)}</b><span>${n} ${plural(n, "действие", "действия", "действий")}</span></div>`;
  const dayItems = (list, d) => list.filter(it => overlaps(it, d)).sort((a, b) => Math.max(a.start, d) - Math.max(b.start, d) || a.end - b.end);
  let html = "";
  if (state.groupL && state.zones.length !== 1){
    for (const k of sortZoneKeys([...new Set(vis.map(zoneKey))])){
      const zl = vis.filter(it => zoneKey(it) === k);
      html += `<div class="zh" style="--zc:${zcolor(k)}"><span class="zdot"></span>${esc(k)}</div>`;
      for (const d of days){
        const its = dayItems(zl, d);
        if (!its.length) continue;
        html += dayHead(d, its.length, true) + its.map(it => cardHtml(it, d)).join("");
      }
    }
  } else {
    for (const d of days){
      const its = dayItems(vis, d);
      if (!its.length) continue;
      html += dayHead(d, its.length, false) + its.map(it => cardHtml(it, d)).join("");
    }
  }
  el.innerHTML = `<div class="list">${html || `<div class="empty">${esc(emptyTxt())}</div>`}</div>`;
}
function tagsHtml(it, showZone = true){
  return (showZone ? it.places : []).map(p => `<span class="tag${isAll(p) ? " all" : ""}">${esc(p)}</span>`).join("") +
    orderC(it).map(c => `<span class="tag${isAll(c) ? " all" : ""}"><span class="dot" style="background:${ccolor(c)}"></span>${esc(c)}</span>`).join("") +
    (it.gate ? `<span class="tag gate right">${TRUCK_SVG.replace("<svg", '<svg width="12" height="12"')}${esc(it.gate)}</span>` : "");
}
const hl = s => { const e = esc(s); if (!query) return e; const i = norm(s).indexOf(query); if (i < 0) return e;
  const raw = String(s); return esc(raw.slice(0, i)) + "<mark>" + esc(raw.slice(i, i + query.length)) + "</mark>" + esc(raw.slice(i + query.length)); };
const plural = (n, a, b, c) => { const m = n % 10, h = n % 100; return m === 1 && h !== 11 ? a : m >= 2 && m <= 4 && (h < 12 || h > 14) ? b : c; };

/* ===== Заезды ===== */
function truckRows(vis){
  return vis.filter(it => it.truck && (state.gate === "*" || it.gate === state.gate)).sort((a, b) => a.start - b.start);
}
function renderTrucks(vis){
  const el = $("#v-trucks");
  const rows = truckRows(vis);
  const g = (v, l) => `<button class="chip${state.gate === v ? " on" : ""}" data-gate="${esc(v)}">${esc(l)}</button>`;
  let html = `<div class="list" style="max-width:1100px"><div class="tbar">${g("*", "Все зоны разгрузки")}${P.lists.gates.map(v => g(v, v)).join("")}<span class="sp"></span>
    <button class="iconbtn" id="cpXls">Копировать для Excel</button><button class="iconbtn" id="cpTxt">Копировать текстом</button></div>`;
  if (!rows.length){ el.innerHTML = html + `<div class="empty">Заездов под выбранные фильтры нет</div></div>`; return; }
  html += `<table class="tt"><thead><tr><th>Время</th><th>Тип</th><th>Зона разгрузки</th><th>Исполнитель</th><th>Что</th><th>Локация</th><th>Комментарий</th></tr></thead><tbody>`;
  let cur = null;
  for (const it of rows){
    const d = dayOf(it.start);
    if (d !== cur){ cur = d; html += `<tr class="dayrow"><td colspan="7"><div class="dh"><span class="zdot"></span>${wd(d)}, ${dayTitle(d)}</div></td></tr>`; }
    html += `<tr class="r" data-id="${it.id}"><td class="tm">${span(it)}</td>
      <td><span class="kind${it.out ? " out" : ""}">${it.out ? "Выезд" : "Заезд"}</span></td>
      <td>${esc(it.gate)}</td><td>${esc(it.contractors.join(", "))}</td><td>${esc(it.action)}</td>
      <td class="hide-m">${esc(it.places.join(", "))}</td><td class="hide-m">${esc(it.comment)}</td></tr>`;
  }
  el.innerHTML = html + `</tbody></table><div class="hint">«Копировать для Excel» — вставь в пустой лист Excel или Google Таблиц, колонки разложатся сами. «Копировать текстом» — для мессенджера.</div></div>`;
}
function copyTrucks(kind){
  const rows = truckRows(visible());
  let txt;
  if (kind === "xls"){
    txt = ["Дата\tНачало\tОкончание\tТип\tЗона разгрузки\tИсполнитель\tЧто\tЛокация\tКомментарий"].concat(rows.map(it =>
      [dm(it.start), it.point === "end" ? "" : hm(it.start), it.point === "start" ? "" : it.point ? hm(it.start) : hm(it.end), it.out ? "Выезд" : "Заезд", it.gate, it.contractors.join(" / "), it.action, it.places.join(" / "), it.comment]
        .map(v => String(v).replace(/[\t\n]/g, " ")).join("\t"))).join("\n");
  } else {
    let cur = null; const out = [`График заездов — ${P.name}`];
    for (const it of rows){
      const d = dayOf(it.start);
      if (d !== cur){ cur = d; out.push("", `${wd(d)}, ${dayTitle(d)}`); }
      out.push(`${span(it)} · ${it.out ? "выезд" : "заезд"} · ${it.gate} · ${it.contractors.join(", ")} — ${it.action}${it.comment ? ` (${it.comment})` : ""}`);
    }
    txt = out.join("\n");
  }
  copy(txt, `Скопировано: ${rows.length} ${plural(rows.length, "строка", "строки", "строк")}`);
}
async function copy(txt, msg){
  try { await navigator.clipboard.writeText(txt); toast(msg); }
  catch(e){
    const ta = document.createElement("textarea"); ta.value = txt; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); toast(msg); } catch(e2){ toast("Не удалось скопировать"); }
    ta.remove();
  }
}
let tt; function toast(m){ const t = $("#toast"); t.textContent = m; t.classList.add("on"); clearTimeout(tt); tt = setTimeout(() => t.classList.remove("on"), 2000); }

/* ===== Карточка работы ===== */
function openItem(id){
  const it = P.items.find(i => i.id === +id); if (!it) return;
  const multi = dayOf(it.end - 1) !== dayOf(it.start);
  const daysTxt = multi ? `<div class="hint" style="margin-top:6px">Действие идёт через полночь — показывается и в ${dm(it.start)}, и в ${dm(it.end - 1)}.</div>` : "";
  $("#sheet").innerHTML = `<button class="x" data-close>×</button>
    <h2>${it.truck ? TRUCK_SVG.replace("<svg", '<svg width="18" height="18" style="vertical-align:-3px;margin-right:6px;color:var(--truck)"') : ""}${esc(it.action)}</h2>
    <div class="big">${it.point ? span(it) + `<small>${it.point === "end" ? "срок окончания" : "момент начала"}</small>` : `${hm(it.start)} – ${hm(it.end)}<small>${durTxt(it.end - it.start)}</small>`}</div>
    <div style="color:var(--muted)">${wd(it.start)}, ${dayTitle(it.start)}${multi ? ` → ${wd(it.end)}, ${dayTitle(it.end)}` : ""}</div>${daysTxt}
    <dl class="kv">
      <dt>Локация</dt><dd>${esc(it.places.join(", ")) || "—"}</dd>
      ${it.gate ? `<dt>Зона разгрузки</dt><dd class="gate"><b style="color:var(--gate-fg)">${esc(it.gate)}</b> · ${it.out ? "выезд" : "заезд"}</dd>` : ""}
      <dt>Исполнители</dt><dd><div class="tags" style="grid-column:auto">${it.contractors.map(c => `<span class="tag${isAll(c) ? " all" : ""}"><span class="dot" style="background:${ccolor(c)}"></span>${esc(c)}</span>`).join("") || "—"}</div></dd>
      <dt>В таблице</dt><dd style="color:var(--muted)">строка ${it.rows.join(" и ")}${it.rows.length > 1 ? " (дубль на следующий день склеен)" : ""}</dd>
    </dl>
    ${it.comment ? `<div class="cmtbox">${esc(it.comment)}</div>` : ""}`;
  $("#ov").classList.add("on");
}
function openWarnings(){
  $("#sheet").innerHTML = `<button class="x" data-close>×</button><h2>Замечания к таблице</h2>
    <div class="hint" style="margin-top:4px">Приложение работает, но эти строки стоит проверить в Excel.</div>
    <ul class="wl">${P.warnings.map(w => `<li>${w.row ? `<b>Строка ${w.row}</b>` : ""}${esc(w.text)}</li>`).join("")}</ul>`;
  $("#ov").classList.add("on");
}
const closeSheet = () => $("#ov").classList.remove("on");

/* ===== Загрузка новой таблицы ===== */
function loadSheetJS(){
  if (window.XLSX) return Promise.resolve();
  return new Promise((res, rej) => {
    const s = document.createElement("script");
    s.src = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
    s.onload = res; s.onerror = () => rej(new Error("Не загрузилась библиотека чтения Excel"));
    document.head.appendChild(s);
  });
}
async function importFile(f){
  try{
    toast("Читаю таблицу…");
    await loadSheetJS();
    const wb = XLSX.read(await f.arrayBuffer(), {type: "array"});
    const sheets = sheetsFromWb(wb);
    const proj = {id: "p" + Date.now(), name: f.name.replace(/\.(xlsx|xlsm|xls)$/i, ""), sheets, lists: await xlsxLists(await f.arrayBuffer())};
    const test = parseProject(proj);
    if (!test.items.length){ toast("В таблице не нашлось действий"); return; }
    projects.push(proj);
    store.set("mp.projects", projects.filter(p => p.id !== "builtin"));
    state.proj = proj.id; resetF(); save();
    loadProject();
    toast(`Загружено: ${test.items.length} ${plural(test.items.length, "действие", "действия", "действий")}`);
  }catch(e){ toast(e.message || "Не получилось прочитать файл"); }
}

/* ===== События ===== */
document.addEventListener("click", e => {
  const t = e.target.closest("[data-day],[data-zone],[data-contr],[data-gate],[data-id],[data-pick],[data-zoom],[data-close],.tab,[data-tronly],#grpBtn,#fBtn,#themeBtn,#warnBtn,#impBtn,#cpXls,#cpTxt,#cGo,#syncBtn,[data-fopen],[data-grp],[data-freset]");
  if (!t){ if (e.target.id === "ov") closeSheet(); return; }
  if (t.dataset.close != null) return closeSheet();
  if (t.classList.contains("tab")){ state.view = t.dataset.v; save(); return renderAll(); }
  if (t.dataset.day != null){ state.day = t.dataset.day === "*" ? "*" : +t.dataset.day; save(); return renderAll(); }
  if (t.dataset.zone != null){ state.zones = toggleSel(state.zones, t.dataset.zone); save(); return renderAll(); }    // несколько локаций; «Все» сбрасывает выбор
  if (t.dataset.contr != null){ state.contrs = toggleSel(state.contrs, t.dataset.contr); save(); return renderAll(); }
  if (t.dataset.gate != null){ state.gate = t.dataset.gate; save(); return renderAll(); }
  if (t.dataset.zoom != null){
    const steps = [6, 9, 14, 22, 34, 50, 72, 100];
    let i = steps.findIndex(s => s >= state.zoom); if (i < 0) i = steps.length - 1;
    i = Math.max(0, Math.min(steps.length - 1, i + +t.dataset.zoom));
    const el = $("#v-gantt"), ratio = steps[i] / state.zoom, lw = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--lw"));
    const center = el.scrollLeft + (el.clientWidth - lw) / 2;
    state.zoom = steps[i]; save(); renderAll();
    el.scrollLeft = center * ratio - (el.clientWidth - lw) / 2;
    return;
  }
  if (t.dataset.tronly != null){ state.trucksOnly = !state.trucksOnly; save(); return renderAll(); }
  if (t.id === "themeBtn"){ userTheme = curTheme() === "light" ? "dark" : "light"; store.set("mp.theme", userTheme); applyTheme(); return; }
  if (t.id === "fBtn"){ $("#controls").classList.toggle("fopen"); return; }
  if (t.dataset.fopen != null){ fOpen = fOpen === t.dataset.fopen ? null : t.dataset.fopen; return renderFilters(); }
  if (t.dataset.freset != null){ resetF(); state.trucksOnly = false; save(); return renderAll(); }
  if (t.id === "grpBtn" || t.dataset.grp != null){ if (state.view === "list") state.groupL = !state.groupL; else state.group = !state.group; save(); return renderAll(); }
  if (t.id === "warnBtn") return openWarnings();
  if (t.id === "impBtn") return $("#file").click();
  if (t.id === "cpXls") return copyTrucks("xls");
  if (t.id === "cpTxt") return copyTrucks("txt");
  if (t.id === "cGo") return connectLive();
  if (t.id === "syncBtn") return forceSync();
  if (t.dataset.pick != null){ sel = +t.dataset.pick; applySel(false); return; }   // таймлайн: пустое место строки — выделить
  if (t.dataset.id != null && state.view === "gantt"){                       // таймлайн: текст названия — карточка, остальное — выделение
    sel = +t.dataset.id; applySel(false);
    if (e.target.closest(".tlink,.bar,.truck-out")) openItem(sel);
    return;
  }
  if (t.dataset.id != null){
    const id = +t.dataset.id;
    if (sel === id) return openItem(id);      // повторное нажатие — карточка
    sel = id; applySel(false); return;
  }
});
document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });
$("#file").addEventListener("change", e => { const f = e.target.files[0]; e.target.value = ""; if (f){ closeSheet(); importFile(f); } });
$("#proj").addEventListener("change", e => {
  const v = e.target.value;
  if (v === "__import"){ e.target.value = state.proj; return openImport(); }
  if (v === "__live"){ e.target.value = state.proj; return openConnect(); }
  if (v === "__share"){ e.target.value = state.proj; return shareLink(); }
  if (v === "__delete"){
    projects = projects.filter(p => p.id !== state.proj);
    store.set("mp.projects", projects.filter(p => p.id !== "builtin"));
    if (!projects.length && LIVE_SHEET){ projects.push(liveProj(LIVE_SHEET)); saveProjects(); }   // совсем пусто быть не может
    state.proj = projects[0].id;
  } else state.proj = v;
  resetF(); save(); liveErr = null; loadProject(); liveTick();
});
document.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.closest && e.target.closest("#cSheet,#cApi")) connectLive(); });
document.addEventListener("visibilitychange", () => { if (!document.hidden) liveTick(); });   // вернулись в приложение — сразу проверить таблицу
/* ширина колонки работ */
const lwKey = () => innerWidth <= 700 ? "lwM" : "lwD";
function applyLw(){ const v = state[lwKey()]; if (v) document.documentElement.style.setProperty("--lw", v + "px"); else document.documentElement.style.removeProperty("--lw"); }
document.addEventListener("pointerdown", e => {
  const h = e.target.closest(".g-resize"); if (!h) return;
  e.preventDefault();
  const startX = e.clientX, startW = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--lw"));
  h.classList.add("drag"); document.body.classList.add("resizing");
  try { h.setPointerCapture(e.pointerId); } catch(_){}
  const move = ev => {
    const w = Math.round(Math.max(90, Math.min(innerWidth - 80, startW + ev.clientX - startX)));
    document.documentElement.style.setProperty("--lw", w + "px"); state[lwKey()] = w;
  };
  const up = () => {
    h.classList.remove("drag"); document.body.classList.remove("resizing");
    h.removeEventListener("pointermove", move); h.removeEventListener("pointerup", up); h.removeEventListener("pointercancel", up);
    save();
  };
  h.addEventListener("pointermove", move); h.addEventListener("pointerup", up); h.addEventListener("pointercancel", up);
});
document.addEventListener("dblclick", e => { if (e.target.closest(".g-resize")){ delete state[lwKey()]; save(); applyLw(); } });
applyLw();

let qt;
$("#q").addEventListener("input", e => {
  e.target.parentElement.classList.toggle("has", !!e.target.value);
  clearTimeout(qt); qt = setTimeout(() => { query = norm(e.target.value); renderAll(); }, 120);
});
$("#qx").addEventListener("click", () => { const q = $("#q"); q.value = ""; q.parentElement.classList.remove("has"); query = ""; renderAll(); q.focus(); });

/* телефон: шапка с названием и панель фильтров лежат поверх контента и сдвигаются вслед за пальцем
   (только transform — прокрутку не трогаем, поэтому без рывков). Закреплённые заголовки внутри
   прокрутки держатся под нижним краем этой «шапки» через --ovl. Отпустил палец посередине — доезжает. */
const rootEl = document.documentElement, topEl = document.querySelector(".top"), ctlEl = document.getElementById("controls");
let off = 0, H = 0, C = 0, dir = 0, touching = false, snapT = 0, tween = 0;
const mobile = () => innerWidth <= 700;
function applyHdr(){
  if (!mobile()){ ["--off","--hdrH","--ovl","--ovlMax"].forEach(p => rootEl.style.removeProperty(p)); return; }
  rootEl.style.setProperty("--off", off + "px");
  rootEl.style.setProperty("--hdrH", H + "px");
  rootEl.style.setProperty("--ovl", (-off) + "px");   // для sticky: отсчёт идёт от верха контента под padding-top
  rootEl.style.setProperty("--ovlMax", (H + C) + "px");
}
function measureHdr(){ H = topEl.offsetHeight; C = ctlEl.offsetHeight; off = Math.min(off, H); applyHdr(); }
try { new ResizeObserver(measureHdr).observe(topEl); new ResizeObserver(measureHdr).observe(ctlEl); } catch(_){}
measureHdr();
const activeView = () => document.getElementById("v-" + state.view);
function animateOff(target){
  cancelAnimationFrame(tween);
  const from = off, t0 = performance.now(), dur = 180;
  const step = now => {
    const k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 3);
    off = from + (target - from) * e; applyHdr();
    if (k < 1) tween = requestAnimationFrame(step);
  };
  tween = requestAnimationFrame(step);
}
function snapHdr(){
  if (!mobile() || touching || off <= 0 || off >= H) return;
  const v = activeView(), y = v.scrollTop;
  if (dir > 0){
    if (y >= H) animateOff(H); else v.scrollTo({top: H, behavior: "smooth"});   // у самого верха досматываем прокруткой
  } else v.scrollTo({top: 0, behavior: "smooth"});                              // у начала — докручиваем до верха
}
const scheduleSnap = () => { clearTimeout(snapT); snapT = setTimeout(snapHdr, 140); };
addEventListener("touchstart", () => { touching = true; cancelAnimationFrame(tween); clearTimeout(snapT); }, {passive: true});
addEventListener("touchend", () => { touching = false; scheduleSnap(); }, {passive: true});
addEventListener("touchcancel", () => { touching = false; scheduleSnap(); }, {passive: true});
document.querySelectorAll(".view").forEach(v => {
  let last = 0;
  v.addEventListener("scroll", () => {
    const y = v.scrollTop, d = y - last; last = y;
    if (!d || !mobile()) return;                       // горизонтальная прокрутка или десктоп
    dir = d > 0 ? 1 : -1;
    // вниз по списку — шапка уезжает за пальцем; вверх — возвращается только у самого начала списка
    off = d > 0 ? Math.min(off + d, H, Math.max(0, y)) : Math.min(off, Math.max(0, y));
    applyHdr();
    scheduleSnap();
  }, {passive: true});
});

let rz; addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => { if (!mobile()) off = 0; measureHdr(); applyLw(); state.view === "gantt" && renderAll(); }, 150); });

applyTheme();
loadProject();
liveTick();
(() => {   // заставка: убираем после анимации или по нажатию
  const s = document.getElementById("splash"); if (!s) return;
  const kill = () => s.remove();
  s.addEventListener("click", () => { s.style.animation = "spOut .25s ease forwards"; setTimeout(kill, 260); });
  s.addEventListener("animationend", e => { if (e.animationName === "spOut") kill(); });
  setTimeout(kill, 3000);
})();
})();
</script>
</body>
</html>
